<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>TGS → JSON конвертер (Lottie)</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
    background: #f5f7fa;
    color: #1f2937;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.sub { color: #6b7280; margin-top: 0; font-size: 14px; }

  .card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    margin-bottom: 16px;
  }

  #drop {
    border: 2px dashed #cbd5e1;
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    color: #64748b;
    cursor: pointer;
    transition: .2s;
    background: #fff;
  }
  #drop.drag { border-color: #6366f1; background: #eef2ff; color: #4338ca; }
  #drop strong { color: #4f46e5; }

  button {
    background: #4f46e5;
    color: #fff;
    border: 0;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: .15s;
  }
  button:hover { background: #4338ca; }
  button:disabled { background: #cbd5e1; cursor: not-allowed; }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  #preview {
    width: 100%;
    height: 320px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    background: #fafafa;
  }

  .error { color: #dc2626; font-size: 14px; }
  .ok    { color: #059669; font-size: 14px; }

  .file-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    margin-top: 8px;
    font-size: 14px;
  }
  .file-item .name { font-weight: 500; }
  .file-item .meta { color: #6b7280; font-size: 12px; margin-left: 8px; }

  #log { font-size: 13px; color: #374151; max-height: 160px; overflow-y: auto; }
</style>
</head>
<body>

<h1>Конвертер .tgs → .json</h1>
<p class="sub">Преобразование Telegram-стикеров (Lottie, gzip) в обычный JSON. Всё работает в браузере.</p>

<div id="drop" class="card">
  <p>Перетащите <strong>.tgs</strong> файлы сюда<br>или <strong>нажмите</strong>, чтобы выбрать</p>
  <input type="file" id="file" accept=".tgs,application/gzip" multiple hidden>
</div>

<div class="card">
  <div class="row">
    <button id="downloadAll" disabled>Скачать все .json</button>
    <button id="clear" disabled>Очистить</button>
    <span id="status"></span>
  </div>
  <div id="files"></div>
</div>

<div class="card">
  <div class="row" style="margin-bottom:10px;">
    <strong>Предпросмотр анимации:</strong>
    <span id="previewName" style="color:#6b7280;font-size:14px;"></span>
  </div>
  <div id="preview"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script>
(() => {
  const drop        = document.getElementById('drop');
  const fileInput   = document.getElementById('file');
  const filesBox    = document.getElementById('files');
  const statusEl    = document.getElementById('status');
  const btnAll      = document.getElementById('downloadAll');
  const btnClear    = document.getElementById('clear');
  const previewBox  = document.getElementById('preview');
  const previewName = document.getElementById('previewName');

  /** @type {{name:string, size:number, text:string, blob:Blob}[]} */
  let results = [];
  let anim = null;

  // ---------- UI: drag & drop ----------
  drop.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => handleFiles(e.target.files));

  ['dragenter','dragover'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));

  drop.addEventListener('drop', e => {
    const files = e.dataTransfer.files;
    if (files.length) handleFiles(files);
  });

  btnClear.addEventListener('click', () => {
    results = [];
    filesBox.innerHTML = '';
    statusEl.textContent = '';
    btnAll.disabled = btnClear.disabled = true;
    if (anim) { anim.destroy(); anim = null; }
    previewName.textContent = '';
    previewBox.innerHTML = '';
  });

  btnAll.addEventListener('click', () => {
    results.forEach(r => downloadBlob(r.blob, r.name.replace(/\.tgs$/i, '') + '.json'));
  });

  // ---------- Основная логика ----------
  async function handleFiles(fileList) {
    const files = [...fileList];
    for (const f of files) {
      setStatus(`Обработка: ${f.name}...`, '');
      try {
        const text  = await tgsToJsonText(f);
        const blob  = new Blob([text], { type: 'application/json' });
        const outName = f.name.replace(/\.tgs$/i, '') + '.json';

        results.push({ name: f.name, size: blob.size, text, blob });
        addFileItem(f.name, outName, blob.size);

        setStatus(`✔ ${f.name} → ${outName}`, 'ok');
        showPreview(text, outName);
      } catch (err) {
        console.error(err);
        setStatus(`✖ ${f.name}: ${err.message}`, 'error');
      }
    }
    btnAll.disabled = btnClear.disabled = results.length === 0;
  }

  /**
   * .tgs (Blob) → строка JSON.
   * .tgs — это gzip-сжатый Lottie JSON.
   */
  async function tgsToJsonText(file) {
    // Проверяем магию gzip: 1f 8b
    const head = new Uint8Array(await file.slice(0, 2).arrayBuffer());
    if (head[0] !== 0x1f || head[1] !== 0x8b) {
      throw new Error('Не gzip-файл. Возможно, это уже .json');
    }

    // Распаковка через DecompressionStream (нативно в браузере)
    let text;
    if (typeof DecompressionStream !== 'undefined') {
      const ds = new DecompressionStream('gzip');
      const stream = file.stream().pipeThrough(ds);
      text = await new Response(stream).text();
    } else {
      // fallback через pako (если нужна поддержка старых браузеров)
      throw new Error('Браузер не поддерживает DecompressionStream');
    }

    // Валидация — что это действительно JSON
    const obj = JSON.parse(text);

    // Проверка, что это похоже на Lottie
    if (typeof obj !== 'object' || !('v' in obj && 'layers' in obj)) {
      console.warn('Файл не похож на Lottie-анимацию');
    }

    // Красивый вывод (можно убрать, если нужен минимальный размер)
    return JSON.stringify(obj, null, 2);
  }

  // ---------- UI-хелперы ----------
  function addFileItem(origName, outName, size) {
    const div = document.createElement('div');
    div.className = 'file-item';
    div.innerHTML = `
      <div>
        <span class="name">${escapeHtml(outName)}</span>
        <span class="meta">${(size/1024).toFixed(1)} КБ</span>
      </div>
    `;
    const btn = document.createElement('button');
    btn.textContent = 'Скачать';
    btn.onclick = () => {
      const r = results.find(x => x.name === origName);
      if (r) downloadBlob(r.blob, outName);
    };
    div.appendChild(btn);
    filesBox.appendChild(div);
  }

  function showPreview(jsonText, name) {
    if (anim) { anim.destroy(); anim = null; }
    previewBox.innerHTML = '';
    previewName.textContent = name;
    try {
      anim = lottie.loadAnimation({
        container: previewBox,
        renderer: 'svg',
        loop: true,
        autoplay: true,
        animationData: JSON.parse(jsonText),
      });
    } catch (e) {
      previewBox.innerHTML = `<p class="error">Не удалось показать превью: ${e.message}</p>`;
    }
  }

  function setStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className = cls || '';
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
})();
</script>
</body>
</html>
